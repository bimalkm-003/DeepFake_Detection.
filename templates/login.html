{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<section class="section">
    <div class="container card" style="max-width: 480px; margin: 0 auto;">
        <h1>Login</h1>
        <form method="post">
            <div style="display:flex;flex-direction:column;gap:14px;">
                <input type="text" name="identifier" placeholder="Username or Email" required
                    style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:#0f1218;color:#e8edf5;" />
                <input type="password" name="password" placeholder="Password" required
                    style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:#0f1218;color:#e8edf5;" />
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
        <p style="margin-top:18px;color:var(--text-secondary);">New here? <a href="{{ url_for('register') }}"
                style="color:var(--accent);">Register</a>.</p>
    </div>
</section>
{% endblock %}
